name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: |
          npm run lint
          npm run build

      - name: Build installer and portable EXE
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ruba-windows-${{ github.sha }}
          path: release/*
          if-no-files-found: error

      - name: Publish public GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/Ruba-Installer-1.0.0-x64.exe release/Ruba-Portable-1.0.0-x64.exe --clobber
          else
            gh release create "$TAG" release/Ruba-Installer-1.0.0-x64.exe release/Ruba-Portable-1.0.0-x64.exe \
              --title "Ruba Packing List 1.0.0" \
              --notes "Installateur Windows et version portable de Ruba Packing List." \
              --latest
          fi
